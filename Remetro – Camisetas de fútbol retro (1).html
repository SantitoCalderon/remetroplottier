<style id="css">  :root {

  .arrow line { stroke: var(--ink); stroke-width: 14; stroke-linecap: round; stroke-dasharray: 1000; stroke-dashoffset: 0; }
  .arrow polygon { fill: var(--ink); }
  @media (prefers-reduced-motion: no-preference) {

    @keyframes rewind { from { stroke-dashoffset: -1000; } to { stroke-dashoffset: 0; } }
    @keyframes head { from { transform: translateX(900px); } to { transform: translateX(0); } }

  .thumb { aspect-ratio: 1 / 1; display: grid; place-items: center; overflow: hidden; background: #0a0a0a; margin-bottom: 1rem; }

  .cart-fab { position: fixed; right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--ink); color: var(--bg); border: 0; padding: .85rem 1.4rem; font-size: 1.05rem; font-weight: 600; box-shadow: 0 6px 24px rgba(0,0,0,.6); }
  .cart-fab span { display: inline-block; min-width: 1.5em; margin-left: .35rem; padding: 0 .4em; background: var(--bg); color: var(--ink); text-align: center; }
  .add-fab { position: fixed; left: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); z-index: 20; width: 3.4rem; height: 3.4rem; border-radius: 50%; border: 1px solid var(--accent); background: #000; color: var(--accent); font-size: 2rem; font-weight: 200; line-height: 1; display: grid; place-items: center; padding: 0 0 .25rem; box-shadow: 0 6px 24px rgba(0,0,0,.6); }
  .add-fab:hover { background: var(--accent); color: #000; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 30; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 31; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

  .qty { display: flex; align-items: center; gap: .5rem; }

  .qty button:hover { border-color: var(--ink); }
  .empty { padding: 2rem 1.5rem; color: var(--muted); flex: 1; margin: 0; }
  .drawer-foot { padding: 1.25rem 1.5rem 1.5rem; border-top: 1px solid var(--line); display: grid; gap: .75rem; }
  .drawer-foot .btn { width: 100%; text-align: center; cursor: pointer; }
  .drawer-foot .clear { background: transparent; border: 0; color: var(--muted); font-size: .95rem; text-decoration: underline; text-underline-offset: 4px; }

  dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); padding: 0; width: min(440px, calc(100% - 2rem)); max-height: calc(100% - 2rem); font-family: var(--font); }
  dialog::backdrop { background: rgba(0,0,0,.78); }
  .dlg-body { padding: 1.5rem; display: grid; gap: 1rem; }
  .dlg-body h2 { font-size: 1.7rem; margin: 0; }

  .dlg-body input { font: inherit; color: var(--ink); background: #000; border: 1px solid var(--line); padding: .65rem .8rem; width: 100%; }

  #fPrev { width: 100%; max-height: 220px; object-fit: contain; background: #000; display: block; }

  .dlg-actions { display: flex; gap: .75rem; justify-content: flex-end; flex-wrap: wrap; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(5rem + env(safe-area-inset-bottom, 0px)); z-index: 40; background: #000; border: 1px solid var(--accent); padding: .6rem 1.2rem; font-size: 1rem; max-width: calc(100% - 2rem); text-align: center; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  function cartMessage() {
    var lines = cart.map(function (c) { return "- " + c.name + " " + c.season + (c.qty > 1 ? " (x" + c.qty + ")" : ""); });
    return "Hola Remetro, quiero consultar por estas camisetas:\n" + lines.join("\n");
  }
  function waLink(text) { return "https://wa.me/" + WHATSAPP + (text ? "?text=" + encodeURIComponent(text) : ""); }
  function renderCart() {
    var total = cart.reduce(function (n, c) { return n + c.qty; }, 0);
    $("cartCount").textContent = total;
    $("cartList").innerHTML = cart.map(function (c, i) {
      return '<li><div><span class="name">' + esc(c.name) + '</span><br><span class="meta">Temporada ' + esc(c.season) + '</span></div>' +
        '<div class="qty"><button type="button" data-act="minus" data-i="' + i + '" aria-label="Quitar una unidad de ' + esc(labelOf(c)) + '">−</button>' +
        '<span>' + c.qty + '</span>' +
        '<button type="button" data-act="plus" data-i="' + i + '" aria-label="Agregar una unidad de ' + esc(labelOf(c)) + '">+</button></div></li>';
    }).join("");
    var empty = cart.length === 0;
    $("cartEmpty").hidden = !empty;
    $("cartList").hidden = empty;
    $("clearCart").hidden = empty;
    var send = $("sendWa");
    if (empty) { send.setAttribute("aria-disabled", "true"); send.removeAttribute("href"); send.style.opacity = ".35"; send.style.pointerEvents = "none"; }
    else { send.removeAttribute("aria-disabled"); send.href = waLink(cartMessage()); send.style.opacity = ""; send.style.pointerEvents = ""; }
  }

  var lastFocus = null;
  function openCart() { lastFocus = document.activeElement; $("overlay").hidden = false; $("drawer").hidden = false; $("cartClose").focus(); }
  function closeCart() { $("overlay").hidden = true; $("drawer").hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }

  /* ===== GUARDAR CAMBIOS (la página se republica con el catálogo actualizado) ===== */
  var toastTimer = null, saveTimer = null;
  function toast(msg, ms) {
    var t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    if (ms) toastTimer = setTimeout(function () { t.hidden = true; }, ms);
  }
  function buildHtml() {
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    var head = $("headtpl").innerHTML;
    return "<!DOCTYPE html>\n<html lang=\"es\"><head>" + head + "<style id=\"css\">" + $("css").textContent + "</style></head><body>" +
      "<template id=\"skeleton\">" + $("skeleton").innerHTML + "</template>" +
      "<template id=\"headtpl\">" + head + "</template>" +
      "<div id=\"root\"></div>" +
      "<script type=\"application/json\" id=\"state\">" + json + "<\/script>" +
      "<script id=\"app\">" + $("app").textContent + "<\/script></body></html>";
  }
  function publishSoon(delay) {
    if (!artifactApi) { toast("No se pudo guardar. Abrí la página desde tu cuenta de Claude.", 5000); return; }
    toast("Guardando cambios…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      var html;
      try { html = buildHtml(); } catch (e) { toast("No se pudo guardar los cambios.", 5000); return; }
      if (html.length > 14000000) { toast("La página tiene demasiadas fotos. Quitá algunas camisetas para poder seguir guardando.", 7000); return; }
      artifactApi.publish(html).catch(function (err) {
        var c = err && err.code;
        if (c === "conflict") return;
        if (c === "not_writer" || c === "not_granted" || c === "consent_required") toast("No tenés permiso para guardar cambios en esta página.", 6000);
        else if (c === "too_large") toast("La página quedó demasiado pesada. Quitá algunas fotos.", 6000);
        else if (c === "rate_limited") toast("Estás guardando muy seguido. Esperá unos segundos y probá de nuevo.", 6000);
        else toast("No se pudo guardar. Probá de nuevo en un momento.", 6000);
      });
    }, delay);
  }

  /* ===== AGREGAR CAMISETA ===== */
  var photoData = "";
  function readPhoto(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onerror = function () { reject(new Error("read")); };
      fr.onload = function () {
        var im = new Image();
        im.onerror = function () { reject(new Error("img")); };
        im.onload = function () {
          var max = 800, k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
          var c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
          var ctx = c.getContext("2d");
          ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(im, 0, 0, c.width, c.height);
          resolve(c.toDataURL("image/jpeg", 0.78));
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  function openAdd() {
    $("clubList").innerHTML = state.clubs.map(function (c) { return '<option value="' + esc(c) + '">'; }).join("");
    $("fClub").value = currentClub !== "Todos" ? currentClub : "";
    $("fName").value = ""; $("fSeason").value = ""; $("fPhoto").value = ""; photoData = "";
    $("fPrev").hidden = true; $("fErr").textContent = ""; $("fSave").disabled = false;
    $("addDlg").showModal();
  }
  function saveProduct() {
    var club = $("fClub").value.trim(), name = $("fName").value.trim(), season = $("fSeason").value.trim();
    if (!club) { $("fErr").textContent = "Elegí o escribí el catálogo (por ejemplo River)."; return; }
    if (!name) { $("fErr").textContent = "Escribí el nombre de la camiseta."; return; }
    if (!season) { $("fErr").textContent = "Escribí la temporada."; return; }
    if (!photoData) { $("fErr").textContent = "Elegí una foto de la camiseta."; return; }
    var existing = state.clubs.filter(function (c) { return c.toLowerCase() === club.toLowerCase(); })[0];
    if (existing) club = existing; else state.clubs.push(club);
    var id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    state.products.push({ id: id, club: club, name: name, season: season, photo: photoData });
    currentClub = club;
    $("addDlg").close();
    renderAll();
    publishSoon(300);
  }

  /* ===== QUITAR (dos toques para confirmar) ===== */
  function twoStep(btn, sureText, action) {
    if (btn.classList.contains("sure")) { action(); return; }
    var old = btn.textContent;
    btn.classList.add("sure"); btn.textContent = sureText;
    setTimeout(function () { btn.classList.remove("sure"); btn.textContent = old; }, 3000);
  }
  function pruneClubs() { state.clubs = state.clubs.filter(function (c) { return state.products.some(function (p) { return p.club === c; }); }); }

  /* ===== EVENTOS ===== */
  $("clubFilter").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-club]"); if (!b) return;
    currentClub = b.getAttribute("data-club"); renderFilter(); renderCatalog();
  });
  $("catalog").addEventListener("click", function (e) {
    var rm = e.target.closest("button[data-rm]");
    if (rm) {
      twoStep(rm, "¿Seguro?", function () {
        var id = rm.getAttribute("data-rm");
        state.products = state.products.filter(function (p) { return p.id !== id; });
        pruneClubs(); renderAll(); publishSoon(2500);
      });
      return;
    }
    var b = e.target.closest("button[data-add]"); if (!b) return;
    var id2 = b.getAttribute("data-add");
    var p = state.products.filter(function (x) { return x.id === id2; })[0]; if (!p) return;
    addToCart(p);
    b.classList.add("done"); b.textContent = "Agregada";
    setTimeout(function () { b.classList.remove("done"); b.textContent = "Agregar al carrito"; }, 1200);
  });
  $("rmExamples").addEventListener("click", function () {
    var btn = $("rmExamples");
    twoStep(btn, "¿Seguro? Se borran todas", function () {
      state.products = state.products.filter(function (p) { return !p.example; });
      pruneClubs(); renderAll(); publishSoon(2500);
    });
  });
  $("cartList").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]"); if (!b) return;
    var i = +b.getAttribute("data-i");
    if (b.getAttribute("data-act") === "plus") cart[i].qty += 1;
    else { cart[i].qty -= 1; if (cart[i].qty <= 0) cart.splice(i, 1); }
    persistCart(); renderCart();
  });
  $("clearCart").addEventListener("click", function () { cart = []; persistCart(); renderCart(); });
  $("cartOpen").addEventListener("click", openCart);
  $("cartClose").addEventListener("click", closeCart);
  $("overlay").addEventListener("click", closeCart);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("drawer").hidden) closeCart(); });

  $("addFab").addEventListener("click", openAdd);
  $("fCancel").addEventListener("click", function () { $("addDlg").close(); });
  $("fPhoto").addEventListener("change", function () {
    var f = $("fPhoto").files && $("fPhoto").files[0];
    photoData = ""; $("fPrev").hidden = true; $("fErr").textContent = "";
    if (!f) return;
    $("fSave").disabled = true;
    readPhoto(f).then(function (d) { photoData = d; $("fPrev").src = d; $("fPrev").hidden = false; })
      .catch(function () { $("fErr").textContent = "No se pudo leer esa foto. Probá con otra."; })
      .then(function () { $("fSave").disabled = false; });
  });
  $("fSave").addEventListener("click", saveProduct);

  $("waDirect").href = waLink("Hola Remetro, quería hacer una consulta.");
  renderAll(); renderCart();

  /* ===== MODO EDICIÓN: solo para quien puede editar la página ===== */
  if (window.claude && typeof window.claude.use === "function") {
    Promise.all([window.claude.use("user"), window.claude.use("artifact")]).then(function (r) {
      var u = r[0]; artifactApi = r[1];
      if (!u || !artifactApi) return;
      return Promise.all([u.isOwner(), u.canEdit()]).then(function (b) {
        owner = !!(b[0] || b[1]);
        if (owner) renderAll();
      });
    }).catch(function () {});
  }
})();
</script></body></html>
